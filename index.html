let audio=null;function tone(freq=440,d=.06,type='sine',vol=.03){try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();let o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(vol,audio.currentTime);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+d);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+d)}catch{}}

function mkResource(type,x,y,hp=2){return{type,x,y,hp,max:hp,dead:false,regrow:0}}

function mkEnemy(type,x,y){let boss=type==='boss';return{type,x,y,hp:boss?180:type==='bat'?28:34,max:boss?180:type==='bat'?28:34,spd:boss?55:type==='bat'?72:48,hit:0,dead:false,phase:0}}
function newState(){let p={x:WORLD*TILE/2,y:WORLD*TILE/2,dirX:1,dirY:0,hp:100,energy:100,xp:0,level:1,coins:0,sel:0,inv:{wood:0,stone:0,fiber:2,ore:0,berry:0,gel:0,coal:0,copper:0,fish:0,flower:0,seed:3,potion:0},hot:['axe','pick','hoe','water','sword','seed'],flags:{},attackCD:0};let surface=genResources('surface');surface.push(mkResource('tree',p.x+110,p.y,3),mkResource('tree',p.x-125,p.y+45,3),mkResource('stone',p.x+45,p.y+120,2),mkResource('stone',p.x-90,p.y-120,2),mkResource('grass',p.x+145,p.y+105,1),mkResource('bush',p.x-155,p.y+115,1));return{v:6,day:1,time:8.2,weather:'clear',weatherT:0,area:'surface',p,resources:{surface,cave:genResources('cave')},enemies:{surface:[mkEnemy('slime',p.x+700,p.y+120),mkEnemy('slime',p.x-550,p.y-320)],cave:[mkEnemy('bat',p.x+260,p.y+120),mkEnemy('slime',p.x-340,p.y+60)]},buildings:[],crops:[],particles:[],drops:[],quest:0,bossSpawned:false,bossDefeated:false,cave:{x:p.x+820,y:p.y-620},fountain:{x:p.x-700,y:p.y+600},lastSave:0}}
let state=newState(),input={dx:0,dy:0},cam={x:0,y:0,shake:0},walkT=0,last=performance.now(),modalOpen=false,toastTimer=0;
const SAVE='meadowMatesMAX6';function save(){try{localStorage.setItem(SAVE,JSON.stringify(state))}catch{}}function load(){try{let s=JSON.parse(localStorage.getItem(SAVE));if(s&&s.p){state=s;state.p.flags=state.p.flags||{};state.p.coins=state.p.coins||0;state.resources=state.resources||{surface:genResources('surface'),cave:genResources('cave')};state.enemies=state.enemies||{surface:[],cave:[]};state.particles=[];return true}}catch{}return false}

function addItem(id,n=1){if(id==='coin'){state.p.coins+=n}else state.p.inv[id]=(state.p.inv[id]||0)+n}

function smartUse(){let n=nearby();if(!n){useSelected();return}if(n.kind==='res'){let t=n.o.type;let tool=t==='tree'?'axe':t==='stone'||t==='rock'||t==='ore'?'pick':null;hitResource(n.o,tool)}else if(n.kind==='enemy')attack(n.o);else if(n.kind==='crop'){if(n.o.age>=3){drop(n.o.x,n.o.y,'berry',2);drop(n.o.x,n.o.y,'seed',1);state.crops.splice(state.crops.indexOf(n.o),1);xp(8);if(state.quest===2)state.quest=3;tone(520,.06)}else{n.o.watered=true;toast('Gegossen')}}else if(n.kind==='cave'){state.area='cave';state.p.x=WORLD*TILE/2;state.p.y=WORLD*TILE/2;toast('Kupferhöhle');tone(180,.12)}else if(n.kind==='exit'){state.area='surface';state.p.x=state.cave.x+80;state.p.y=state.cave.y;toast('Zurück an der Oberfläche')}else if(n.kind==='fountain'){state.p.energy=100;toast('Energie aufgefüllt');tone(480,.08)}else if(n.kind==='build'&&n.o.type==='campfire'){state.p.hp=Math.min(100,state.p.hp+25);toast('Du ruhst dich aus')}}
function hitResource(r,tool){if(state.p.energy<3){toast('Zu erschöpft');return}state.p.energy-=3;let dmg=1;if(tool==='axe'&&state.p.flags.copperAxe)dmg=2;if(tool==='pick'&&state.p.flags.copperPick)dmg=2;r.hp-=dmg;cam.shake=4;haptic(10);tone(r.type==='tree'?180:250,.03,'square',.02);emit(r.x,r.y,r.type==='tree'?'#b07a46':'#aab0ad',5);if(r.hp<=0){r.dead=true;r.regrow=state.day+3;let loot={tree:['wood',irnd(3,5)],stone:['stone',irnd(2,4)],rock:['stone',irnd(2,3)],ore:['ore',irnd(2,4)],bush:['berry',irnd(2,4)],grass:['fiber',irnd(2,4)],flower:['flower',1]}[r.type];if(loot){drop(r.x,r.y,loot[0],loot[1]);if(r.type==='ore'&&Math.random()<.55)drop(r.x+10,r.y,'coal',1)}xp(3);if(state.quest===0&&(state.p.inv.wood>=12&&state.p.inv.stone>=8))state.quest=1}}
function attack(e){if(state.p.attackCD>0)return;state.p.attackCD=.28;let dmg=state.p.flags.copperSword?18:12;e.hp-=dmg;e.hit=.14;cam.shake=e.type==='boss'?7:4;emit(e.x,e.y,'#d87870',8);tone(120,.045,'sawtooth',.03);haptic(15);if(e.hp<=0){e.dead=true;drop(e.x,e.y,'gel',e.type==='boss'?8:irnd(1,2));drop(e.x+8,e.y-4,'coin',e.type==='boss'?25:irnd(1,3));xp(e.type==='boss'?80:12);if(e.type==='boss'){state.bossDefeated=true;state.quest=6;toast('Großer Schleim besiegt!');tone(760,.18,'triangle',.05)}}}
function useSelected(){let id=state.p.hot[state.p.sel];if(id==='seed'){plant()}else if(id==='potion'){if((state.p.inv.potion||0)>0){state.p.inv.potion--;state.p.hp=Math.min(100,state.p.hp+35);toast('Heiltrank benutzt');tone(520,.08)}else toast('Kein Heiltrank')}else if(id==='hoe'){till()}else if(id==='water'){let n=nearby(74);if(n&&n.kind==='crop'){n.o.watered=true;toast('Gegossen')}else toast('Keine Pflanze in Reichweite')}else{let n=nearby();if(n&&n.kind==='res'){let t=n.o.type,need=t==='tree'?'axe':t==='stone'||t==='rock'||t==='ore'?'pick':id;if(id===need)hitResource(n.o,id);else toast('Falsches Werkzeug')}else if(id==='sword'&&n&&n.kind==='enemy')attack(n.o)}}
function till(){if(state.area!=='surface'){toast('Hier kannst du nicht pflügen');return}let p=state.p,x=Math.round((p.x+p.dirX*58)/TILE)*TILE,y=Math.round((p.y+p.dirY*58)/TILE)*TILE;state.buildings.push({type:'soil',x,y,area:'surface'});toast('Boden vorbereitet')}

function craft(r){if(!spend(r.cost)){toast('Nicht genug Ressourcen');return}if(r.type==='item'){for(let k in r.give)addItem(k,r.give[k]);toast(r.name+' hergestellt')}else if(r.type==='upgrade'){state.p.flags[r.flag]=true;toast(r.name+' hergestellt')}else{let p=state.p,x=Math.round((p.x+p.dirX*68)/TILE)*TILE,y=Math.round((p.y+p.dirY*68)/TILE)*TILE;state.buildings.push({type:r.id,x,y,area:state.area});toast(r.name+' platziert');if(r.id==='workbench'&&state.quest===1)state.quest=2}if(r.id==='copper'&&state.quest===4)state.quest=5;renderModal('craft');renderUI();save()}
function spawnBoss(){if(state.bossSpawned||state.bossDefeated||state.quest<5)return;state.bossSpawned=true;state.enemies.surface.push(mkEnemy('boss',state.p.x+500,state.p.y-250));toast('Etwas Großes bewegt sich im Gras...')}
function update(dt){let p=state.p;p.attackCD=Math.max(0,p.attackCD-dt);walkT+=dt*8*(Math.abs(input.dx)+Math.abs(input.dy));let mag=Math.hypot(input.dx,input.dy);if(mag>.08){let spd=150+Math.min(30,p.level*2);let dx=input.dx/mag,dy=input.dy/mag;p.x=clamp(p.x+dx*spd*dt,2*TILE,(WORLD-2)*TILE);p.y=clamp(p.y+dy*spd*dt,2*TILE,(WORLD-2)*TILE);p.dirX=dx;p.dirY=dy;p.energy=Math.max(0,p.energy-dt*.6)}else p.energy=Math.min(100,p.energy+dt*1.1);
state.time+=dt*.32;if(state.time>=24){state.time-=24;state.day++;for(let c of state.crops){if(c.watered){c.age=Math.min(3,c.age+1);c.watered=false}}for(let a of Object.values(state.resources))for(let r of a)if(r.dead&&r.regrow<=state.day){r.dead=false;r.hp=r.max}if(Math.random()<.45)state.weather=Math.random()<.5?'rain':'clear';save()}
state.weatherT+=dt;if(state.weatherT>90){state.weatherT=0;state.weather=Math.random()<.25?'rain':Math.random()<.18?'mist':'clear'}
let enemies=currentEnemies();for(let e of enemies){if(e.dead)continue;e.hit=Math.max(0,e.hit-dt);let d=dist(p,e);if(d<330){let dx=(p.x-e.x)/(d||1),dy=(p.y-e.y)/(d||1);e.x+=dx*e.spd*dt;e.y+=dy*e.spd*dt;if(d<34&&Math.random()<dt*1.5){p.hp-=e.type==='boss'?12:6;cam.shake=6;haptic(25);if(p.hp<=0){p.hp=100;p.energy=100;p.x=WORLD*TILE/2;p.y=WORLD*TILE/2;toast('Du wurdest ohnmächtig');state.p.coins=Math.max(0,state.p.coins-5)}}}}
for(let d of state.drops){d.t+=dt;let dd=dist(p,d);if(dd<95){let k=Math.max(.15,1-dd/95);d.x+=(p.x-d.x)*dt*5*k;d.y+=(p.y-d.y)*dt*5*k}if(dd<24){addItem(d.id,d.n);d.dead=true;tone(660,.03,'triangle',.02);if(state.quest===0&&(state.p.inv.wood>=12&&state.p.inv.stone>=8))state.quest=1;if(state.quest===3&&state.p.inv.ore>=6)state.quest=4;if(state.quest===4&&state.p.inv.copper>=1)state.quest=5}}state.drops=state.drops.filter(d=>!d.dead);
for(let b of state.buildings)if(b.type==='campfire'&&b.area===state.area&&dist(p,b)<90)p.hp=Math.min(100,p.hp+dt*1.4);
for(let q of state.particles){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=120*dt;q.life-=dt}state.particles=state.particles.filter(q=>q.life>0);cam.x+=(p.x-W/2-cam.x)*Math.min(1,dt*6);cam.y+=(p.y-H/2-cam.y)*Math.min(1,dt*6);cam.shake=Math.max(0,cam.shake-dt*18);if(performance.now()-state.lastSave>7000){state.lastSave=performance.now();save()}spawnBoss();renderUI()}
function draw(){ctx.clearRect(0,0,W,H);let sx=cam.shake?rnd(-cam.shake,cam.shake):0,sy=cam.shake?rnd(-cam.shake,cam.shake):0;ctx.save();ctx.translate(sx,sy);drawWorld();drawBuilds();drawCrops();drawDrops();drawResources();drawEnemies();drawPlayer();drawParticles();ctx.restore();drawLighting();drawWeather();drawMini()}

function drawResources(){for(let r of currentResources()){if(r.dead)continue;let x=r.x-cam.x,y=r.y-cam.y;if(x<-70||y<-70||x>W+70||y>H+70)continue;if(r.type==='tree'){ctx.fillStyle='rgba(0,0,0,.2)';ctx.beginPath();ctx.ellipse(x,y+24,24,8,0,0,TAU);ctx.fill();ctx.fillStyle='#6d4829';ctx.fillRect(x-7,y-4,14,34);ctx.fillStyle='#3f7045';for(let a=0;a<6;a++){let ang=a*TAU/6;ctx.beginPath();ctx.arc(x+Math.cos(ang)*15,y-18+Math.sin(ang)*11,18,0,TAU);ctx.fill()}ctx.fillStyle='#5f965c';ctx.beginPath();ctx.arc(x,y-26,18,0,TAU);ctx.fill()}else if(r.type==='stone'||r.type==='rock'||r.type==='ore'){ctx.fillStyle=r.type==='ore'?'#7a6258':'#7f8784';ctx.beginPath();ctx.moveTo(x-18,y+12);ctx.lineTo(x-15,y-8);ctx.lineTo(x-4,y-18);ctx.lineTo(x+15,y-10);ctx.lineTo(x+20,y+7);ctx.lineTo(x+7,y+17);ctx.closePath();ctx.fill();if(r.type==='ore'){ctx.fillStyle='#c67e4b';for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(x-7+i*8,y-5+(i%2)*8,4,0,TAU);ctx.fill()}}}else if(r.type==='bush'){ctx.fillStyle='#4f824e';for(let i=0;i<5;i++){ctx.beginPath();ctx.arc(x+(i-2)*7,y+Math.sin(i)*4,10,0,TAU);ctx.fill()}ctx.fillStyle='#bf5756';for(let i=0;i<4;i++){ctx.beginPath();ctx.arc(x-12+i*8,y-4+(i%2)*8,3,0,TAU);ctx.fill()}}else if(r.type==='grass'){ctx.strokeStyle='#72a85f';ctx.lineWidth=3;for(let i=-2;i<=2;i++){ctx.beginPath();ctx.moveTo(x+i*4,y+12);ctx.quadraticCurveTo(x+i*5,y,x+i*2,y-9-Math.abs(i)*2);ctx.stroke()}}else{ctx.strokeStyle='#5a8d52';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x,y+12);ctx.lineTo(x,y-8);ctx.stroke();ctx.fillStyle='#e4c865';ctx.beginPath();ctx.arc(x,y-11,6,0,TAU);ctx.fill()}}

function drawWeather(){if(state.weather==='rain'){ctx.strokeStyle='rgba(190,220,235,.35)';ctx.lineWidth=1;for(let i=0;i<75;i++){let x=(i*73+performance.now()*.14)%W,y=(i*47+performance.now()*.28)%H;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-5,y+10);ctx.stroke()}}if(state.weather==='mist'){ctx.fillStyle='rgba(220,235,228,.08)';for(let i=0;i<7;i++){ctx.beginPath();ctx.ellipse((i*137+performance.now()*.01)%W,80+i*70,150,40,0,0,TAU);ctx.fill()}}}
function drawMini(){mctx.clearRect(0,0,164,164);mctx.fillStyle=state.area==='cave'?'#252b28':'#648b53';mctx.fillRect(0,0,164,164);mctx.fillStyle='#416f82';for(let y=0;y<18;y++)for(let x=0;x<18;x++)if(worldTile(Math.floor(x/18*WORLD),Math.floor(y/18*WORLD),state.area)==='water')mctx.fillRect(x*9.2,y*9.2,10,10);mctx.fillStyle='#e6cd78';mctx.beginPath();mctx.arc(state.p.x/(WORLD*TILE)*164,state.p.y/(WORLD*TILE)*164,4,0,TAU);mctx.fill();if(state.area==='surface'){mctx.fillStyle='#191d1a';mctx.beginPath();mctx.arc(state.cave.x/(WORLD*TILE)*164,state.cave.y/(WORLD*TILE)*164,3,0,TAU);mctx.fill()}}
function iconCanvas(id){let c=document.createElement('canvas');c.width=c.height=40;let g=c.getContext('2d');drawIcon(g,id,20,20);return c}function drawIcon(g,id,x,y){g.save();g.translate(x,y);g.lineCap='round';g.lineJoin='round';if(id==='wood'){g.fillStyle='#9a6c3f';g.fillRect(-14,-5,28,10);g.fillStyle='#c39258';g.beginPath();g.arc(-13,0,5,0,TAU);g.fill()}else if(id==='stone'){g.fillStyle='#9ba2a4';g.beginPath();g.moveTo(-14,8);g.lineTo(-10,-9);g.lineTo(5,-14);g.lineTo(15,0);g.lineTo(8,12);g.closePath();g.fill()}else if(['fiber','seed','flower'].includes(id)){g.strokeStyle='#79b868';g.lineWidth=4;g.beginPath();g.moveTo(0,12);g.quadraticCurveTo(-5,0,-2,-12);g.stroke();g.fillStyle=id==='flower'?'#e1c666':'#8fcf7a';g.beginPath();g.arc(0,-7,6,0,TAU);g.fill()}else if(id==='ore'||id==='copper'||id==='coal'){g.fillStyle=id==='coal'?'#454a49':id==='copper'?'#d6965e':'#c77b4b';g.beginPath();g.arc(0,0,12,0,TAU);g.fill()}else if(id==='berry'){g.fillStyle='#bd5557';for(let a of[-6,0,6]){g.beginPath();g.arc(a,0,6,0,TAU);g.fill()}}else if(id==='gel'){g.fillStyle='#77c987';g.beginPath();g.ellipse(0,3,13,10,0,0,TAU);g.fill()}else if(id==='potion'){g.fillStyle='#ad5f74';g.fillRect(-8,-9,16,18);g.fillStyle='#d9d1be';g.fillRect(-4,-14,8,5)}else{g.strokeStyle='#ece5c8';g.lineWidth=4;if(id==='axe'){g.beginPath();g.moveTo(-7,13);g.lineTo(7,-12);g.stroke();g.fillStyle='#9ba2a4';g.fillRect(2,-15,12,9)}if(id==='pick'){g.beginPath();g.moveTo(-7,13);g.lineTo(5,-10);g.stroke();g.beginPath();g.moveTo(-11,-8);g.quadraticCurveTo(0,-16,13,-8);g.stroke()}if(id==='hoe'){g.beginPath();g.moveTo(-6,13);g.lineTo(5,-11);g.stroke();g.beginPath();g.moveTo(0,-12);g.lineTo(12,-8);g.stroke()}if(id==='water'){g.fillStyle='#88b7c9';g.fillRect(-11,-7,20,17);g.strokeStyle='#88b7c9';g.beginPath();g.arc(0,-2,15,Math.PI,TAU);g.stroke()}if(id==='sword'){g.beginPath();g.moveTo(-9,12);g.lineTo(9,-11);g.stroke();g.beginPath();g.moveTo(-11,4);g.lineTo(-3,12);g.stroke()}}g.restore()}
function renderUI(){let p=state.p;ui.stats.innerHTML=`<div class="stat"><span class="dot wood"></span>${p.inv.wood||0}</div><div class="stat"><span class="dot stone"></span>${p.inv.stone||0}</div><div class="stat"><span class="dot ore"></span>${p.inv.ore||0}</div><div class="stat"><span class="dot coin"></span>${p.coins||0}</div>`;let hr=Math.floor(state.time),min=Math.floor((state.time-hr)*60).toString().padStart(2,'0');ui.day.innerHTML=`Tag ${state.day} · ${String(hr).padStart(2,'0')}:${min}<div class="muted">${state.area==='surface'?'Wiesenland':'Kupferhöhle'}</div>`;let need=p.level*50;ui.bars.innerHTML=`<div class="barrow">HP<div class="bar"><div class="fill hp" style="width:${p.hp}%"></div></div><span>${Math.round(p.hp)}</span></div><div class="barrow">ENERGIE<div class="bar"><div class="fill energy" style="width:${p.energy}%"></div></div><span>${Math.round(p.energy)}</span></div><div class="barrow">LV ${p.level}<div class="bar"><div class="fill xp" style="width:${p.xp/need*100}%"></div></div><span>${p.xp}</span></div>`;let q=QUESTS[state.quest]||QUESTS.at(-1);ui.quest.innerHTML=`<b>${q[0]}</b><br><span class="muted">${q[1]}</span>`;ui.hotbar.innerHTML='';p.hot.forEach((id,i)=>{let d=document.createElement('div');d.className='slot'+(i===p.sel?' sel':'');d.appendChild(iconCanvas(id));if(ITEMS[id]?.[1]==='stack'){let s=document.createElement('small');s.textContent=p.inv[id]||0;d.appendChild(s)}d.onclick=()=>{p.sel=i;renderUI()};ui.hotbar.appendChild(d)});let c=context();ui.use.textContent=c?c.label:'INTERAGIEREN';ui.context.textContent=c?c.hint:'Erkunde die Umgebung';ui.weather.textContent=state.weather==='rain'?'🌧 Regen':state.weather==='mist'?'🌫 Nebel':'☀️ Klar'}
function openModal(tab='inventory'){modalOpen=true;ui.modalWrap.style.display='flex';renderModal(tab)}function closeModal(){modalOpen=false;ui.modalWrap.style.display='none'}
function renderModal(tab){let tabs=[['inventory','Inventar'],['craft','Crafting'],['skills','Fortschritt'],['help','Hilfe']];ui.tabs.innerHTML='';for(let[t,n]of tabs){let d=document.createElement('div');d.className='tab'+(t===tab?' active':'');d.textContent=n;d.onclick=()=>renderModal(t);ui.tabs.appendChild(d)}if(tab==='inventory'){ui.modalTitle.textContent='Inventar';ui.modalDesc.textContent='Deine gesammelten Materialien und Verbrauchsgegenstände.';let ids=['wood','stone','fiber','ore','coal','copper','berry','gel','flower','seed','potion'];ui.body.innerHTML='<div class="grid">'+ids.map(id=>`<div class="card"><h3>${ITEMS[id][0]}</h3><p>${state.p.inv[id]||0} Stück</p>${id==='potion'?'<button data-use="potion">Benutzen</button>':''}</div>`).join('')+'</div>';ui.body.querySelectorAll('[data-use="potion"]').forEach(b=>b.onclick=()=>{if((state.p.inv.potion||0)>0){state.p.inv.potion--;state.p.hp=Math.min(100,state.p.hp+35);toast('Heiltrank benutzt');tone(520,.08);renderUI()}renderModal('inventory')})}else if(tab==='craft'){ui.modalTitle.textContent='Crafting & Base';ui.modalDesc.textContent='Gegenstände werden vor dir platziert. Upgrades wirken dauerhaft.';ui.body.innerHTML='<div class="grid">'+RECIPES.map((r,i)=>`<div class="card"><h3>${r.name}</h3><p>${r.desc}<br><span class="small">${Object.entries(r.cost).map(([k,v])=>`${v} ${ITEMS[k]?.[0]||k}`).join(' · ')}</span></p><button data-r="${i}" ${can(r.cost)&&!(r.flag&&state.p.flags[r.flag])?'':'disabled'}>${r.flag&&state.p.flags[r.flag]?'Erledigt':'Herstellen'}</button></div>`).join('')+'</div>';ui.body.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>craft(RECIPES[+b.dataset.r]))}else if(tab==='skills'){ui.modalTitle.textContent='Fortschritt';ui.modalDesc.textContent='Level und dauerhafte Verbesserungen.';ui.body.innerHTML=`<div class="grid"><div class="card"><h3>Level ${state.p.level}</h3><p>${state.p.xp}/${state.p.level*50} XP</p></div><div class="card"><h3>Kupferschwert</h3><p>${state.p.flags.copperSword?'Aktiv · +50% Schaden':'Noch nicht hergestellt'}</p></div><div class="card"><h3>Kupferaxt</h3><p>${state.p.flags.copperAxe?'Aktiv · schneller fällen':'Noch nicht hergestellt'}</p></div><div class="card"><h3>Kupferspitzhacke</h3><p>${state.p.flags.copperPick?'Aktiv · schneller abbauen':'Noch nicht hergestellt'}</p></div><div class="card"><h3>Boss</h3><p>${state.bossDefeated?'Großer Schleim besiegt':'Noch nicht besiegt'}</p></div><div class="card"><h3>Tag ${state.day}</h3><p>${state.weather==='rain'?'Regen':'Klares Wetter'}</p></div></div>`}else{ui.modalTitle.textContent='Steuerung';ui.modalDesc.textContent='Links bewegen, rechts interagieren. INTERAGIEREN wählt automatisch die sinnvolle Aktion. WERKZEUG nutzt bewusst dein ausgewähltes Hotbar-Item.';ui.body.innerHTML='<div class="card"><h3>Tipps</h3><p>Holz + Stein → Werkbank. In der Höhle findest du Kupfer und Kohle. Pflanzen wachsen beim Tageswechsel, wenn sie gegossen wurden. Lagerfeuer heilen in ihrer Nähe. Für den Boss brauchst du gutes Timing oder das Kupferschwert.</p></div>'}}
function setupInput(){let active=false,start={x:0,y:0};const move=e=>{if(!active)return;let t=e.touches?e.touches[0]:e,rect=ui.joy.getBoundingClientRect(),cx=rect.left+rect.width/2,cy=rect.top+rect.height/2,dx=t.clientX-cx,dy=t.clientY-cy,m=Math.hypot(dx,dy),max=38;if(m>max){dx=dx/m*max;dy=dy/m*max}input.dx=dx/max;input.dy=dy/max;ui.stick.style.transform=`translate(${dx}px,${dy}px)`};ui.joy.addEventListener('pointerdown',e=>{active=true;ui.joy.setPointerCapture?.(e.pointerId);move(e);e.preventDefault()});ui.joy.addEventListener('pointermove',e=>{if(active)move(e)});const end=()=>{active=false;input.dx=input.dy=0;ui.stick.style.transform='translate(0,0)'};ui.joy.addEventListener('pointerup',end);ui.joy.addEventListener('pointercancel',end);addEventListener('keydown',e=>{let k=e.key.toLowerCase();if(k==='w'||k==='arrowup')input.dy=-1;if(k==='s'||k==='arrowdown')input.dy=1;if(k==='a'||k==='arrowleft')input.dx=-1;if(k==='d'||k==='arrowright')input.dx=1});addEventListener('keyup',e=>{let k=e.key.toLowerCase();if(['w','s','arrowup','arrowdown'].includes(k))input.dy=0;if(['a','d','arrowleft','arrowright'].includes(k))input.dx=0})}
setupInput();
$('useBtn').addEventListener('pointerdown',e=>{e.preventDefault();smartUse()});$('toolBtn').addEventListener('pointerdown',e=>{e.preventDefault();useSelected()});$('craftBtn').onclick=()=>openModal('craft');$('invBtn').onclick=()=>openModal('inventory');$('menuBtn').onclick=()=>openModal('help');$('closeModal').onclick=closeModal;ui.modalWrap.addEventListener('pointerdown',e=>{if(e.target===ui.modalWrap)closeModal()});
let lastTouchEnd=0;document.addEventListener('touchend',e=>{let now=Date.now();if(now-lastTouchEnd<=360)e.preventDefault();lastTouchEnd=now},{passive:false});document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});document.addEventListener('dblclick',e=>{if(e.target.closest('button,.btn,.action,.slot,#joystick,#menuBtn'))e.preventDefault()},{passive:false});
$('newBtn').onclick=()=>{state=newState();save();ui.title.style.display='none';renderUI()};$('continueBtn').onclick=()=>{if(!load())state=newState();ui.title.style.display='none';renderUI()};if(!localStorage.getItem(SAVE))$('continueBtn').style.display='none';
function loop(now){let dt=Math.min(.033,(now-last)/1000);last=now;if(ui.title.style.display==='none'&&!modalOpen)update(dt);draw();requestAnimationFrame(loop)}renderUI();requestAnimationFrame(loop);
})();
</script>
</body>
