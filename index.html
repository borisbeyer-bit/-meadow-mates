<!doctype html>
<html lang="de">
<head>

<style>
  :root{--ink:#f6f4e8;--panel:rgba(17,30,22,.88);--panel2:rgba(31,51,37,.94);--line:rgba(255,255,255,.12);--gold:#e8c878;--danger:#d86a66;--ok:#8fcf7a;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0f1712;color:var(--ink);font-family:Inter,ui-rounded,"SF Pro Rounded",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;touch-action:none}
  #game{display:block;width:100vw;height:100vh;background:#15251b}
  #ui{position:fixed;inset:0;pointer-events:none;padding:max(10px,env(safe-area-inset-top)) 10px max(10px,env(safe-area-inset-bottom)) 10px}
  .panel{background:var(--panel);backdrop-filter:blur(10px);border:1px solid var(--line);box-shadow:0 8px 30px rgba(0,0,0,.24);border-radius:16px}
  #topbar{position:absolute;left:12px;right:12px;top:max(12px,env(safe-area-inset-top));display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
  #stats{display:flex;gap:8px;padding:8px 10px;align-items:center}.stat{display:flex;gap:6px;align-items:center;font-weight:800;font-size:14px}.dot{width:11px;height:11px;border-radius:3px;background:#fff}.wood{background:#9a6c3f}.stone{background:#9ba2a4}.fiber{background:#79b868}.ore{background:#d18c55}
  #daybox{padding:8px 12px;text-align:right;font-weight:800;font-size:13px;line-height:1.25}.muted{opacity:.72;font-weight:650}
  #bars{position:absolute;left:12px;top:76px;width:min(260px,62vw);padding:8px 10px}.barrow{display:grid;grid-template-columns:38px 1fr 36px;gap:8px;align-items:center;font-size:11px;font-weight:800}.bar{height:8px;border-radius:999px;background:rgba(255,255,255,.1);overflow:hidden}.fill{height:100%;border-radius:999px}.hp{background:#d66866}.energy{background:#dfb95f}
  #quest{position:absolute;left:12px;top:142px;max-width:min(360px,75vw);padding:10px 12px;font-size:12px;line-height:1.35}
  #hotbar{position:absolute;left:50%;bottom:max(12px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:6px;padding:7px;pointer-events:auto}.slot{width:48px;height:48px;border-radius:12px;border:1px solid var(--line);background:rgba(21,34,25,.9);display:grid;place-items:center;position:relative}.slot.sel{outline:2px solid var(--gold);transform:translateY(-2px)}.slot canvas{width:30px;height:30px}.slot small{position:absolute;right:4px;bottom:2px;font-size:10px;font-weight:900}
  #joystick{position:absolute;left:18px;bottom:max(88px,calc(env(safe-area-inset-bottom) + 72px));width:124px;height:124px;border:2px solid rgba(255,255,255,.12);border-radius:50%;background:rgba(20,35,25,.34);pointer-events:auto}.stick{position:absolute;width:54px;height:54px;border-radius:50%;left:35px;top:35px;background:rgba(246,244,232,.78);box-shadow:0 5px 20px rgba(0,0,0,.25)}
  #targetHint{position:absolute;right:16px;bottom:max(238px,calc(env(safe-area-inset-bottom) + 222px));max-width:180px;padding:8px 10px;border-radius:12px;background:rgba(11,20,14,.82);border:1px solid var(--line);font-size:11px;font-weight:850;text-align:center;opacity:.95}#actions{position:absolute;right:16px;bottom:max(86px,calc(env(safe-area-inset-bottom) + 70px));display:grid;grid-template-columns:72px 72px;gap:10px;pointer-events:auto}.action{height:72px;border-radius:20px;border:1px solid var(--line);background:rgba(232,200,120,.92);color:#2b2314;font-weight:950;font-size:11px;letter-spacing:.02em;display:grid;place-items:center;text-align:center;box-shadow:0 6px 0 rgba(111,82,35,.42)}.action:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(111,82,35,.42)}.action.secondary{background:rgba(215,223,207,.92);color:#223126}
  #menuBtn{position:absolute;right:14px;top:142px;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;pointer-events:auto;background:var(--panel2);border:1px solid var(--line);font-weight:900}
  #toast{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);padding:10px 14px;border-radius:12px;background:rgba(9,15,11,.88);font-weight:800;font-size:13px;opacity:0;transition:.2s;max-width:80vw;text-align:center}
  .modalWrap{position:fixed;inset:0;background:rgba(4,8,5,.62);display:none;align-items:center;justify-content:center;padding:18px;pointer-events:auto;z-index:10}.modal{width:min(560px,100%);max-height:82vh;overflow:auto;background:#17271d;border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:0 24px 70px rgba(0,0,0,.42)}.modal h2{margin:0 0 6px;font-size:22px}.modal p{margin:0 0 12px;color:#cbd5cc;font-size:13px;line-height:1.4}.tabs{display:flex;gap:6px;margin:12px 0}.tab{flex:1;padding:9px;border-radius:12px;background:#223729;border:1px solid var(--line);text-align:center;font-weight:850;font-size:12px}.tab.active{background:#d8c57e;color:#2a2416}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.card{background:#203326;border:1px solid var(--line);border-radius:14px;padding:10px;min-height:92px}.card h3{font-size:13px;margin:6px 0 3px}.card p{font-size:11px;margin:0 0 8px}.card button,.primary{width:100%;padding:9px;border:0;border-radius:10px;background:#dcc778;color:#2a2416;font-weight:900}.card button:disabled{opacity:.38}.close{float:right;border:0;background:#2a4030;color:white;border-radius:10px;padding:7px 10px;font-weight:800}
  #title{position:fixed;inset:0;z-index:20;background:radial-gradient(circle at 50% 35%,#365a3d 0,#1c3122 45%,#0e1711 100%);display:flex;align-items:center;justify-content:center;padding:20px}.titleCard{width:min(520px,100%);text-align:center}.logo{font-size:40px;font-weight:1000;letter-spacing:.06em;text-shadow:0 8px 30px rgba(0,0,0,.35)}.subtitle{opacity:.8;margin:8px 0 22px}.start{border:0;border-radius:16px;padding:14px 18px;background:#e5cb7a;color:#241f12;font-weight:950;font-size:16px;width:100%;margin:6px 0}.start.alt{background:#294331;color:#f5f1dc;border:1px solid rgba(255,255,255,.12)}.tiny{font-size:11px;opacity:.62;margin-top:12px;line-height:1.4}
  @media (min-width:800px){#joystick{left:34px;bottom:34px}#actions{right:34px;bottom:34px}#hotbar{bottom:20px}.slot{width:54px;height:54px}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui">
  <div id="topbar"><div id="stats" class="panel"></div><div id="daybox" class="panel"></div></div>
  <div id="bars" class="panel"></div>
  <div id="quest" class="panel"></div>
  <div id="menuBtn">☰</div>
  <div id="joystick"><div class="stick"></div></div>
  <div id="targetHint">In die Nähe eines Objekts gehen</div><div id="actions"><div class="action" id="useBtn">INTERAGIEREN</div><div class="action secondary" id="interactBtn">WERKZEUG</div><div class="action secondary" id="craftBtn">BAUEN</div><div class="action secondary" id="invBtn">INVENTAR</div></div>
  <div id="hotbar" class="panel"></div>
  <div id="toast"></div>
</div>
<div id="title"><div class="titleCard"><div class="logo">MEADOW MATES</div><div class="subtitle">Cozy crafting · farming · exploration</div><button class="start" id="continueBtn">WEITERSPIELEN</button><button class="start alt" id="newBtn">NEUE WELT</button><div class="tiny">Alpha v0.4 · optimiert für iPhone · direktere Interaktion & überarbeitete Grafik.</div></div></div>
<div class="modalWrap" id="modalWrap"><div class="modal"><button class="close" id="closeModal">Schließen</button><h2 id="modalTitle">Inventar</h2><p id="modalDesc"></p><div class="tabs" id="tabs"></div><div id="modalBody"></div></div></div>
<script>
(() => {
'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const ui={stats:document.getElementById('stats'),day:document.getElementById('daybox'),bars:document.getElementById('bars'),quest:document.getElementById('quest'),hotbar:document.getElementById('hotbar'),toast:document.getElementById('toast'),joy:document.getElementById('joystick'),stick:document.querySelector('.stick'),modalWrap:document.getElementById('modalWrap'),modalTitle:document.getElementById('modalTitle'),modalDesc:document.getElementById('modalDesc'),tabs:document.getElementById('tabs'),body:document.getElementById('modalBody'),title:document.getElementById('title'),targetHint:document.getElementById('targetHint'),useBtn:document.getElementById('useBtn')};
let W=innerWidth,H=innerHeight,DPR=Math.min(2,devicePixelRatio||1);function resize(){W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize();
const TAU=Math.PI*2, clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rnd=(a,b)=>a+Math.random()*(b-a),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const TILE=48, WORLD=72;
const COLORS={grass:'#79a95f',grass2:'#6e9e56',dirt:'#8c6a4a',water:'#4f8da1',sand:'#c8b675',rock:'#747d78',cave:'#303735',cave2:'#252b2a',farm:'#6f5139'};
const items={axe:{name:'Axt',type:'tool',icon:'axe'},pick:{name:'Spitzhacke',type:'tool',icon:'pick'},hoe:{name:'Hacke',type:'tool',icon:'hoe'},water:{name:'Gießkanne',type:'tool',icon:'water'},sword:{name:'Schwert',type:'tool',icon:'sword'},seed:{name:'Samen',type:'stack',icon:'seed'},wood:{name:'Holz',type:'stack',icon:'wood'},stone:{name:'Stein',type:'stack',icon:'stone'},fiber:{name:'Fasern',type:'stack',icon:'fiber'},ore:{name:'Kupfererz',type:'stack',icon:'ore'},berry:{name:'Beeren',type:'stack',icon:'berry'},gel:{name:'Schleimgel',type:'stack',icon:'gel'}};
const recipes=[
 {id:'workbench',name:'Werkbank',desc:'Schaltet bessere Baupläne frei.',cost:{wood:12,stone:6},kind:'place'},
 {id:'chest',name:'Truhe',desc:'Dekoratives Lagerobjekt.',cost:{wood:10},kind:'place'},
 {id:'campfire',name:'Lagerfeuer',desc:'Heilt dich in der Nähe langsam.',cost:{wood:6,stone:4},kind:'place'},
 {id:'floor',name:'Holzboden',desc:'Ein Stück deiner Base.',cost:{wood:2},kind:'place'},
 {id:'wall',name:'Holzwand',desc:'Grenzt deine Base ab.',cost:{wood:4},kind:'place'},
 {id:'seed5',name:'5 Samen',desc:'Mehr Gemüse anbauen.',cost:{fiber:4},kind:'item',gives:{seed:5}}
];
let state;
function newState(){
 const seed=Math.floor(Math.random()*1e9); const tiles=[]; const objs=[];
 for(let y=0;y<WORLD;y++){tiles[y]=[];for(let x=0;x<WORLD;x++){let edge=Math.min(x,y,WORLD-1-x,WORLD-1-y);let n=Math.sin((x+seed%17)*.28)+Math.cos((y+seed%23)*.31)+Math.sin((x+y)*.12);let t='grass';if(edge<4||n<-2.0)t='water';else if(n<-1.45)t='sand';else if(n>2.0)t='rock';tiles[y][x]=t;}}
 const cx=Math.floor(WORLD/2),cy=Math.floor(WORLD/2);for(let y=cy-6;y<=cy+6;y++)for(let x=cx-7;x<=cx+7;x++)tiles[y][x]='grass';
 for(let i=0;i<320;i++){let x=rnd(5,WORLD-5),y=rnd(5,WORLD-5),t=tiles[Math.floor(y)][Math.floor(x)];if(t==='grass'&&Math.hypot(x-cx,y-cy)>7)objs.push({id:'o'+i,type:Math.random()<.64?'tree':Math.random()<.78?'rock':'bush',x:x*TILE,y:y*TILE,hp:Math.random()<.64?3:4});}
 for(let i=0;i<18;i++){let a=rnd(0,TAU),r=rnd(10,22);objs.push({id:'m'+i,type:'slime',x:(cx+Math.cos(a)*r)*TILE,y:(cy+Math.sin(a)*r)*TILE,hp:3,vx:0,vy:0});}
 objs.push({id:'cave',type:'cave',x:(cx+15)*TILE,y:(cy-9)*TILE,hp:999});
 // Handgesetzter Startbereich: sofort etwas zu tun und visuell interessanter.
 const starter=[['tree',-3,-1,3],['tree',3,-2,3],['tree',-2,3,3],['rock',2,2,4],['rock',4,1,4],['bush',-4,2,2],['bush',1,-4,2]];
 starter.forEach((a,i)=>objs.push({id:'starter'+i,type:a[0],x:(cx+a[1])*TILE,y:(cy+a[2])*TILE,hp:a[3]}));
 return {version:4,seed,tiles,objects:objs,buildings:[],crops:[],drops:[],player:{x:cx*TILE,y:cy*TILE,hp:100,energy:100,facing:0,inv:{wood:0,stone:0,fiber:0,ore:0,berry:2,gel:0,seed:6},hotbar:['axe','pick','hoe','water','sword','seed'],selected:0},day:1,time:7.5,area:'surface',quest:0,lastSave:Date.now()};
}
function save(){state.lastSave=Date.now();localStorage.setItem('meadowMatesAlpha4',JSON.stringify(state));toast('Spiel gespeichert');}
function load(){try{let s=JSON.parse(localStorage.getItem('meadowMatesAlpha4'));if(s&&s.version===4){state=s;return true}}catch(e){}return false}
function tileAt(wx,wy){let x=Math.floor(wx/TILE),y=Math.floor(wy/TILE);if(x<0||y<0||x>=WORLD||y>=WORLD)return'water';return state.tiles[y][x]}
function solid(wx,wy){let t=tileAt(wx,wy);if(t==='water'||t==='rock')return true;for(const b of state.buildings){if((b.type==='wall'||b.type==='workbench'||b.type==='chest')&&Math.abs(b.x-wx)<25&&Math.abs(b.y-wy)<25)return true}return false}
const input={dx:0,dy:0,keys:{}};addEventListener('keydown',e=>input.keys[e.key.toLowerCase()]=true);addEventListener('keyup',e=>input.keys[e.key.toLowerCase()]=false);
let joyId=null,joyCenter={x:0,y:0};function joyMove(x,y){let dx=x-joyCenter.x,dy=y-joyCenter.y,d=Math.hypot(dx,dy),m=46;if(d>m){dx*=m/d;dy*=m/d;d=m}input.dx=dx/m;input.dy=dy/m;ui.stick.style.transform=`translate(${dx}px,${dy}px)`}ui.joy.addEventListener('pointerdown',e=>{joyId=e.pointerId;let r=ui.joy.getBoundingClientRect();joyCenter={x:r.left+r.width/2,y:r.top+r.height/2};ui.joy.setPointerCapture(e.pointerId);joyMove(e.clientX,e.clientY)});ui.joy.addEventListener('pointermove',e=>{if(e.pointerId===joyId)joyMove(e.clientX,e.clientY)});function joyEnd(e){if(e.pointerId===joyId){joyId=null;input.dx=input.dy=0;ui.stick.style.transform='translate(0,0)'}}ui.joy.addEventListener('pointerup',joyEnd);ui.joy.addEventListener('pointercancel',joyEnd);
function toast(t){ui.toast.textContent=t;ui.toast.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>ui.toast.style.opacity=0,1200)}
function nearest(max=72,types=null){let best=null,bd=max;for(const o of state.objects){if(types&& !types.includes(o.type))continue;let d=dist(state.player,o);if(d<bd){bd=d;best=o}}return best}
function nearestBuilding(max=72){let best=null,bd=max;for(const o of state.buildings){let d=dist(state.player,o);if(d<bd){bd=d;best=o}}return best}
function addItem(id,n=1){if(!state.player.inv[id])state.player.inv[id]=0;state.player.inv[id]+=n}
function spend(cost){for(const k in cost)if((state.player.inv[k]||0)<cost[k])return false;for(const k in cost)state.player.inv[k]-=cost[k];return true}
function currentContext(){
 let p=state.player;
 let o=nearest(82,['tree','rock','bush','slime','cave']);
 let crop=state.crops.find(c=>Math.hypot(c.x-p.x,c.y-p.y)<76);
 if(crop&&crop.age>=3)return{kind:'harvest',crop,label:'ERNTEN',hint:'Reife Pflanze ernten'};
 if(crop&&!crop.watered)return{kind:'water',crop,label:'GIESSEN',hint:'Pflanze gießen'};
 if(o){
  if(o.type==='tree')return{kind:'hit',tool:'axe',o,label:'FAELLEN',hint:'Baum fällen'};
  if(o.type==='rock')return{kind:'hit',tool:'pick',o,label:'ABBAUEN',hint:state.area==='cave'?'Kupfergestein abbauen':'Stein abbauen'};
  if(o.type==='bush')return{kind:'hit',tool:'axe',o,label:'SAMMELN',hint:'Beeren & Fasern sammeln'};
  if(o.type==='slime')return{kind:'hit',tool:'sword',o,label:'ANGREIFEN',hint:'Schleim angreifen'};
  if(o.type==='cave')return{kind:'cave',o,label:state.area==='surface'?'HÖHLE':'RAUS',hint:state.area==='surface'?'Kupferhöhle betreten':'Zur Oberfläche zurück'};
 }
 let gx=Math.round(p.x/TILE)*TILE,gy=Math.round(p.y/TILE)*TILE,t=tileAt(gx,gy);
 if(t==='farm'&&!state.crops.some(c=>c.x===gx&&c.y===gy)&&(p.inv.seed||0)>0)return{kind:'plant',label:'PFLANZEN',hint:'Samen pflanzen'};
 if(t==='grass')return{kind:'hoe',label:'BODEN',hint:'Feld anlegen'};
 let fire=state.buildings.find(b=>b.type==='campfire'&&dist(p,b)<85);
 if(fire)return{kind:'fire',label:'RASTEN',hint:'Am Lagerfeuer erholen'};
 return null;
}
function doHit(o,tool){
 if(state.player.energy<=1){toast('Zu erschöpft');return}
 state.player.energy=Math.max(0,state.player.energy-2);o.hp--;hitFx(o.x,o.y);screenShake=.12;
 if(o.hp<=0){
  let gains=[];
  if(o.type==='tree'){let n=Math.floor(rnd(3,6));addItem('wood',n);addItem('fiber',1);gains.push('+'+n+' Holz','+1 Faser')}
  if(o.type==='rock'){let id=state.area==='cave'&&Math.random()<.55?'ore':'stone',n=Math.floor(rnd(2,5));addItem(id,n);gains.push('+'+n+' '+items[id].name)}
  if(o.type==='bush'){addItem('fiber',2);addItem('berry',2);gains.push('+2 Fasern','+2 Beeren')}
  if(o.type==='slime'){addItem('gel',2);gains.push('+2 Schleimgel');state.quest=Math.max(state.quest,4)}
  state.objects=state.objects.filter(x=>x!==o);floatText(o.x,o.y,gains.join('  '));toast('Gesammelt');
 }
}
function smartUse(){
 let c=currentContext(); if(!c){toast('Nichts in Reichweite');return}
 if(c.kind==='hit'){doHit(c.o,c.tool);return}
 if(c.kind==='cave'){toggleCave();return}
 if(c.kind==='harvest'){addItem('berry',3);state.crops=state.crops.filter(x=>x!==c.crop);floatText(c.crop.x,c.crop.y,'+3 Ernte');toast('Geerntet');return}
 if(c.kind==='water'){c.crop.watered=true;toast('Gegossen');return}
 if(c.kind==='plant'){plant();return}
 if(c.kind==='hoe'){let gx=Math.round(state.player.x/TILE)*TILE,gy=Math.round(state.player.y/TILE)*TILE,tx=Math.floor(gx/TILE),ty=Math.floor(gy/TILE);state.tiles[ty][tx]='farm';toast('Feld angelegt');return}
 if(c.kind==='fire'){state.player.hp=Math.min(100,state.player.hp+25);toast('Am Feuer erholt');return}
}
function useTool(){
 let id=state.player.hotbar[state.player.selected];
 if(id==='seed'){plant();return}
 if(id==='hoe'){let gx=Math.round(state.player.x/TILE)*TILE,gy=Math.round(state.player.y/TILE)*TILE;if(tileAt(gx,gy)==='grass'){state.tiles[Math.floor(gy/TILE)][Math.floor(gx/TILE)]='farm';toast('Feld angelegt')}else toast('Hier nicht');return}
 if(id==='water'){let c=state.crops.find(c=>Math.hypot(c.x-state.player.x,c.y-state.player.y)<76);if(c){c.watered=true;toast('Gegossen')}else toast('Keine Pflanze in Reichweite');return}
 let types=id==='axe'?['tree','bush']:id==='pick'?['rock']:id==='sword'?['slime']:[];
 let o=nearest(82,types);if(o)doHit(o,id);else toast('Kein passendes Ziel');
}
function action(){smartUse()}
function plant(){if((state.player.inv.seed||0)<=0){toast('Keine Samen');return}let gx=Math.round(state.player.x/TILE)*TILE,gy=Math.round(state.player.y/TILE)*TILE;if(tileAt(gx,gy)!=='farm'){toast('Erst Boden mit der Hacke bearbeiten');return}if(state.crops.some(c=>c.x===gx&&c.y===gy)){toast('Hier wächst schon etwas');return}state.player.inv.seed--;state.crops.push({x:gx,y:gy,age:0,watered:false});toast('Gepflanzt')}
function toggleCave(){state.area=state.area==='surface'?'cave':'surface';if(state.area==='cave'){state.player.x=36*TILE;state.player.y=36*TILE;generateCave()}else{state.player.x=51*TILE;state.player.y=27*TILE}toast(state.area==='cave'?'Die Kupferhöhle':'Zurück an der Oberfläche')}
function generateCave(){if(state.caveGenerated)return;state.caveGenerated=true;state.caveObjects=[];for(let i=0;i<90;i++)state.objects.push({id:'cr'+i,type:'rock',x:rnd(12,60)*TILE,y:rnd(12,60)*TILE,hp:4});for(let i=0;i<22;i++)state.objects.push({id:'cs'+i,type:'slime',x:rnd(14,58)*TILE,y:rnd(14,58)*TILE,hp:4});state.objects.push({id:'exit',type:'cave',x:36*TILE,y:34*TILE,hp:999})}
const particles=[];const floaters=[];let screenShake=0,walkT=0;function floatText(x,y,text){floaters.push({x,y,text,life:1.05})}function hitFx(x,y){for(let i=0;i<7;i++)particles.push({x,y,vx:rnd(-40,40),vy:rnd(-70,-15),life:.5})}
function update(dt){if(!state)return;let p=state.player;let kx=(input.keys.d||input.keys.arrowright?1:0)-(input.keys.a||input.keys.arrowleft?1:0),ky=(input.keys.s||input.keys.arrowdown?1:0)-(input.keys.w||input.keys.arrowup?1:0);let dx=input.dx+kx,dy=input.dy+ky,l=Math.hypot(dx,dy);if(l>1){dx/=l;dy/=l}let speed=150, nx=p.x+dx*speed*dt,ny=p.y+dy*speed*dt;if(!solid(nx,p.y))p.x=nx;if(!solid(p.x,ny))p.y=ny;if(Math.abs(dx)+Math.abs(dy)>.05){p.facing=Math.atan2(dy,dx);walkT+=dt*10}else walkT*=.9;p.x=clamp(p.x,TILE,WORLD*TILE-TILE);p.y=clamp(p.y,TILE,WORLD*TILE-TILE);
 state.time+=dt*.12;if(state.time>=24){state.time-=24;state.day++;for(const c of state.crops){if(c.watered)c.age++;c.watered=false}p.energy=100;state.quest=Math.max(state.quest,2)}
 p.energy=Math.min(100,p.energy+dt*.6);
 for(const o of state.objects){if(o.type!=='slime')continue;let d=dist(p,o);if(d<240){let a=Math.atan2(p.y-o.y,p.x-o.x);o.x+=Math.cos(a)*36*dt;o.y+=Math.sin(a)*36*dt;if(d<34&&Math.random()<dt*.75){p.hp=Math.max(0,p.hp-5);toast('Autsch!')}}}
 for(const b of state.buildings){if(b.type==='campfire'&&dist(p,b)<95)p.hp=Math.min(100,p.hp+dt*1.2)}
 if(p.hp<=0){p.hp=100;p.x=36*TILE;p.y=36*TILE;toast('Du wachst zuhause wieder auf')}
 for(let i=particles.length-1;i>=0;i--){let q=particles[i];q.life-=dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=120*dt;if(q.life<=0)particles.splice(i,1)}for(let i=floaters.length-1;i>=0;i--){let f=floaters[i];f.life-=dt;f.y-=18*dt;if(f.life<=0)floaters.splice(i,1)}screenShake=Math.max(0,screenShake-dt);
 if(Date.now()-state.lastSave>20000){state.lastSave=Date.now();localStorage.setItem('meadowMatesAlpha4',JSON.stringify(state))}
 updateQuest();renderUI();}
function updateQuest(){let q=state.quest;if(q===0&&(state.player.inv.wood||0)>=8)state.quest=1;if(q===1&&state.buildings.some(b=>b.type==='workbench'))state.quest=2;if(q===2&&state.crops.some(c=>c.age>=2))state.quest=3;if(q===3&&(state.player.inv.ore||0)>=5)state.quest=4}
let camera={x:0,y:0};function cam(){let tx=state.player.x-W/2,ty=state.player.y-H/2;camera.x+=(tx-camera.x)*.12;camera.y+=(ty-camera.y)*.12;let sh=screenShake>0?screenShake*18:0;return{x:camera.x+rnd(-sh,sh),y:camera.y+rnd(-sh,sh)}}
function draw(){ctx.clearRect(0,0,W,H);if(!state)return;let c=cam(),x0=Math.max(0,Math.floor(c.x/TILE)-2),y0=Math.max(0,Math.floor(c.y/TILE)-2),x1=Math.min(WORLD,Math.ceil((c.x+W)/TILE)+2),y1=Math.min(WORLD,Math.ceil((c.y+H)/TILE)+2);for(let y=y0;y<y1;y++)for(let x=x0;x<x1;x++){let t=state.area==='cave'?( ((x+y)%5===0)?'cave2':'cave'):state.tiles[y][x],sx=x*TILE-c.x,sy=y*TILE-c.y;ctx.fillStyle=COLORS[t]||COLORS.grass;ctx.fillRect(sx,sy,TILE+1,TILE+1);if(t==='grass'){let h=(x*17+y*31+state.seed)%17;if(h===0||h===5){ctx.strokeStyle='rgba(31,84,47,.28)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(sx+10,sy+34);ctx.lineTo(sx+8,sy+27);ctx.moveTo(sx+10,sy+34);ctx.lineTo(sx+14,sy+29);ctx.stroke()}if(h===2){ctx.fillStyle='rgba(245,220,121,.75)';ctx.beginPath();ctx.arc(sx+30,sy+17,2.2,0,TAU);ctx.fill();ctx.fillStyle='rgba(255,255,255,.6)';for(let a=0;a<4;a++){ctx.beginPath();ctx.arc(sx+30+Math.cos(a*1.57)*3,sy+17+Math.sin(a*1.57)*3,1.3,0,TAU);ctx.fill()}}}if(t==='water'){let wave=Math.sin(performance.now()/500+x*.8+y)*3;ctx.strokeStyle='rgba(210,244,255,.18)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(sx+7,sy+18+wave);ctx.quadraticCurveTo(sx+19,sy+14+wave,sx+32,sy+18+wave);ctx.stroke();ctx.beginPath();ctx.moveTo(sx+17,sy+34-wave);ctx.quadraticCurveTo(sx+30,sy+30-wave,sx+42,sy+34-wave);ctx.stroke()}if(t==='farm'){ctx.strokeStyle='rgba(40,25,15,.25)';for(let yy=8;yy<TILE;yy+=10){ctx.beginPath();ctx.moveTo(sx+5,sy+yy);ctx.lineTo(sx+TILE-5,sy+yy);ctx.stroke()}}}
 for(const b of state.buildings)drawBuilding(b,c);for(const crop of state.crops)drawCrop(crop,c);for(const o of state.objects){if(state.area==='surface'&&(o.id.startsWith('cr')||o.id.startsWith('cs')||o.id==='exit'))continue;if(state.area==='cave'&&!(o.id.startsWith('cr')||o.id.startsWith('cs')||o.id==='exit'))continue;drawObject(o,c)}for(const q of particles){ctx.globalAlpha=Math.max(0,q.life*2);ctx.fillStyle='#f1d08a';ctx.fillRect(q.x-c.x,q.y-c.y,4,4);ctx.globalAlpha=1}let target=currentContext();if(target&&target.o){ctx.strokeStyle='rgba(243,218,128,.8)';ctx.lineWidth=2;ctx.setLineDash([5,5]);ctx.beginPath();ctx.ellipse(target.o.x-c.x,target.o.y-c.y+18,29,12,0,0,TAU);ctx.stroke();ctx.setLineDash([])}for(const f of floaters){ctx.globalAlpha=Math.max(0,f.life);ctx.font='800 12px system-ui';ctx.textAlign='center';ctx.fillStyle='#fff4c2';ctx.strokeStyle='rgba(0,0,0,.45)';ctx.lineWidth=3;ctx.strokeText(f.text,f.x-c.x,f.y-c.y-28);ctx.fillText(f.text,f.x-c.x,f.y-c.y-28);ctx.globalAlpha=1}drawPlayer(c);drawNight();}
function drawObject(o,c){let x=o.x-c.x,y=o.y-c.y;if(x<-90||y<-90||x>W+90||y>H+90)return;ctx.save();ctx.translate(x,y);ctx.fillStyle='rgba(10,18,12,.22)';ctx.beginPath();ctx.ellipse(0,22,22,8,0,0,TAU);ctx.fill();if(o.type==='tree'){ctx.fillStyle='#5a3b27';ctx.fillRect(-7,4,14,31);ctx.fillStyle='#71492e';ctx.fillRect(-3,5,5,30);for(const [ox,oy,r,col] of [[0,-15,28,'#2f6d42'],[-18,-5,20,'#3d8050'],[17,-7,19,'#367748'],[2,-31,18,'#4b905a']]){ctx.fillStyle=col;ctx.beginPath();ctx.arc(ox,oy,r,0,TAU);ctx.fill()}ctx.fillStyle='rgba(235,255,211,.12)';ctx.beginPath();ctx.arc(-8,-25,10,0,TAU);ctx.fill()}else if(o.type==='rock'){ctx.fillStyle=state.area==='cave'?'#71665f':'#6f7976';ctx.beginPath();ctx.moveTo(-23,13);ctx.lineTo(-16,-12);ctx.lineTo(-4,-21);ctx.lineTo(13,-16);ctx.lineTo(23,2);ctx.lineTo(14,19);ctx.closePath();ctx.fill();ctx.fillStyle='rgba(255,255,255,.13)';ctx.beginPath();ctx.moveTo(-12,-10);ctx.lineTo(-3,-16);ctx.lineTo(5,-13);ctx.lineTo(-2,-5);ctx.closePath();ctx.fill();if(state.area==='cave'){ctx.fillStyle='#c97f4e';ctx.beginPath();ctx.arc(5,-3,6,0,TAU);ctx.arc(-7,6,4,0,TAU);ctx.fill()}}else if(o.type==='bush'){for(const [ox,oy,r] of [[-10,2,15],[8,0,17],[0,-10,15]]){ctx.fillStyle='#3f7b48';ctx.beginPath();ctx.arc(ox,oy,r,0,TAU);ctx.fill()}ctx.fillStyle='#d45f64';for(const a of [0,1.9,3.6,5.2]){ctx.beginPath();ctx.arc(Math.cos(a)*11,Math.sin(a)*7-2,3.5,0,TAU);ctx.fill()}}else if(o.type==='slime'){let bob=Math.sin(performance.now()/220+o.x*.01)*2;ctx.translate(0,bob);ctx.fillStyle='#75bf7d';ctx.beginPath();ctx.ellipse(0,5,20,15,0,0,TAU);ctx.fill();ctx.fillStyle='rgba(255,255,255,.23)';ctx.beginPath();ctx.ellipse(-6,-1,7,4,-.5,0,TAU);ctx.fill();ctx.fillStyle='#173421';ctx.fillRect(-8,1,3,5);ctx.fillRect(5,1,3,5)}else if(o.type==='cave'){ctx.fillStyle='#171c19';ctx.beginPath();ctx.arc(0,7,30,Math.PI,0);ctx.fillRect(-30,6,60,30);ctx.fill();ctx.strokeStyle='#6f7770';ctx.lineWidth=5;ctx.stroke();ctx.fillStyle='rgba(255,255,255,.09)';ctx.beginPath();ctx.arc(-10,-8,12,Math.PI,Math.PI*1.5);ctx.stroke()}ctx.restore()}
function drawBuilding(b,c){let x=b.x-c.x,y=b.y-c.y;ctx.save();ctx.translate(x,y);if(b.type==='floor'){ctx.fillStyle='#a87947';ctx.fillRect(-23,-23,46,46);ctx.strokeStyle='#7f5937';ctx.strokeRect(-23,-23,46,46)}if(b.type==='wall'){ctx.fillStyle='#8c6038';ctx.fillRect(-23,-11,46,22);ctx.fillStyle='#b07a45';ctx.fillRect(-23,-11,46,5)}if(b.type==='workbench'){ctx.fillStyle='#6f4b2d';ctx.fillRect(-22,-8,44,18);ctx.fillStyle='#a87947';ctx.fillRect(-25,-13,50,8);ctx.fillRect(-17,10,6,18);ctx.fillRect(11,10,6,18)}if(b.type==='chest'){ctx.fillStyle='#8b5b32';ctx.fillRect(-19,-14,38,29);ctx.fillStyle='#c8914d';ctx.fillRect(-19,-5,38,5);ctx.fillStyle='#d7bd77';ctx.fillRect(-3,-2,6,9)}if(b.type==='campfire'){ctx.fillStyle='#6d5b4a';for(const a of [0,2.1,4.2]){ctx.beginPath();ctx.arc(Math.cos(a)*10,Math.sin(a)*8+7,6,0,TAU);ctx.fill()}ctx.fillStyle='#f5b94c';ctx.beginPath();ctx.moveTo(0,-18);ctx.quadraticCurveTo(14,0,0,10);ctx.quadraticCurveTo(-13,0,0,-18);ctx.fill()}ctx.restore()}
function drawCrop(crop,c){let x=crop.x-c.x,y=crop.y-c.y,a=Math.min(3,crop.age);ctx.fillStyle=crop.watered?'#567f46':'#4c6d3d';if(a===0){ctx.fillRect(x-2,y-5,4,9)}else{ctx.beginPath();ctx.arc(x-6,y,5+a*2,0,TAU);ctx.arc(x+6,y,5+a*2,0,TAU);ctx.fill();if(a>=2){ctx.fillStyle='#d6b65e';ctx.beginPath();ctx.arc(x,y-7,5,0,TAU);ctx.fill()}}}
function drawPlayer(c){let p=state.player,x=p.x-c.x,y=p.y-c.y;let moving=Math.abs(input.dx)+Math.abs(input.dy)>.08;let step=moving?Math.sin(walkT)*3:0;ctx.save();ctx.translate(x,y);ctx.fillStyle='rgba(0,0,0,.22)';ctx.beginPath();ctx.ellipse(0,19,15,6,0,0,TAU);ctx.fill();ctx.fillStyle='#223c4d';ctx.fillRect(-9,18+step,7,11);ctx.fillRect(2,18-step,7,11);ctx.fillStyle='#315e78';ctx.beginPath();ctx.roundRect(-11,-1,22,23,5);ctx.fill();ctx.fillStyle='#e6b982';ctx.beginPath();ctx.arc(0,-10,11,0,TAU);ctx.fill();ctx.fillStyle='#473226';ctx.beginPath();ctx.arc(0,-14,12,Math.PI,TAU);ctx.fill();ctx.fillRect(-11,-15,22,4);ctx.fillStyle='#f2d38b';ctx.fillRect(-12,-24,24,5);ctx.fillStyle='#6e4b2e';ctx.fillRect(-8,-29,16,7);ctx.fillStyle='#17262f';ctx.fillRect(-5,-11,2,2);ctx.fillRect(4,-11,2,2);ctx.restore()}
function drawNight(){if(state.area==='cave'){ctx.fillStyle='rgba(4,8,7,.45)';ctx.fillRect(0,0,W,H);return}let t=state.time,alpha=t<5?0.58:t<7?(7-t)/2*.58:t>19&&t<22?(t-19)/3*.5:t>=22?.58:0;if(alpha>0){ctx.fillStyle=`rgba(18,28,48,${alpha})`;ctx.fillRect(0,0,W,H)}}
function iconCanvas(id){let c=document.createElement('canvas');c.width=c.height=40;let g=c.getContext('2d');drawIcon(g,id,20,20,1);return c}
function drawIcon(g,id,x,y,s){g.save();g.translate(x,y);g.scale(s,s);g.lineCap='round';g.lineJoin='round';if(id==='wood'){g.fillStyle='#9a6c3f';g.fillRect(-14,-5,28,10);g.fillStyle='#c39258';g.beginPath();g.arc(-13,0,5,0,TAU);g.fill()}else if(id==='stone'){g.fillStyle='#9ba2a4';g.beginPath();g.moveTo(-14,8);g.lineTo(-10,-9);g.lineTo(5,-14);g.lineTo(15,0);g.lineTo(8,12);g.closePath();g.fill()}else if(id==='fiber'||id==='seed'){g.strokeStyle='#79b868';g.lineWidth=4;g.beginPath();g.moveTo(0,12);g.quadraticCurveTo(-5,0,-2,-12);g.stroke();g.fillStyle='#8fcf7a';g.beginPath();g.ellipse(-6,-5,7,4,-.5,0,TAU);g.ellipse(5,1,7,4,.5,0,TAU);g.fill()}else if(id==='ore'){g.fillStyle='#c77b4b';g.beginPath();g.arc(0,0,12,0,TAU);g.fill()}else if(id==='berry'){g.fillStyle='#bd5557';g.beginPath();g.arc(-5,2,6,0,TAU);g.arc(5,1,6,0,TAU);g.arc(0,-5,6,0,TAU);g.fill()}else if(id==='gel'){g.fillStyle='#77c987';g.beginPath();g.ellipse(0,3,13,10,0,0,TAU);g.fill()}else{g.strokeStyle='#ece5c8';g.lineWidth=4;if(id==='axe'){g.beginPath();g.moveTo(-7,13);g.lineTo(7,-12);g.stroke();g.fillStyle='#9ba2a4';g.fillRect(2,-15,12,9)}if(id==='pick'){g.beginPath();g.moveTo(-7,13);g.lineTo(5,-10);g.stroke();g.beginPath();g.moveTo(-11,-8);g.quadraticCurveTo(0,-16,13,-8);g.stroke()}if(id==='hoe'){g.beginPath();g.moveTo(-6,13);g.lineTo(5,-11);g.stroke();g.beginPath();g.moveTo(0,-12);g.lineTo(12,-8);g.stroke()}if(id==='water'){g.fillStyle='#88b7c9';g.fillRect(-11,-7,20,17);g.strokeStyle='#88b7c9';g.beginPath();g.arc(0,-2,15,Math.PI,TAU);g.stroke()}if(id==='sword'){g.beginPath();g.moveTo(-9,12);g.lineTo(9,-11);g.stroke();g.beginPath();g.moveTo(-11,4);g.lineTo(-3,12);g.stroke()}}g.restore()}
function renderUI(){let p=state.player;ui.stats.innerHTML=`<div class="stat"><span class="dot wood"></span>${p.inv.wood||0}</div><div class="stat"><span class="dot stone"></span>${p.inv.stone||0}</div><div class="stat"><span class="dot fiber"></span>${p.inv.fiber||0}</div><div class="stat"><span class="dot ore"></span>${p.inv.ore||0}</div>`;let hr=Math.floor(state.time),min=Math.floor((state.time-hr)*60).toString().padStart(2,'0');ui.day.innerHTML=`Tag ${state.day} · ${hr.toString().padStart(2,'0')}:${min}<div class="muted">${state.area==='surface'?'Wiesenland':'Kupferhöhle'}</div>`;ui.bars.innerHTML=`<div class="barrow">HP<div class="bar"><div class="fill hp" style="width:${p.hp}%"></div></div><span>${Math.round(p.hp)}</span></div><div class="barrow">ENERGIE<div class="bar"><div class="fill energy" style="width:${p.energy}%"></div></div><span>${Math.round(p.energy)}</span></div>`;let qs=[['Sammle 8 Holz','Fälle Bäume mit der Axt.'],['Baue eine Werkbank','Öffne BAUEN und platziere sie in deiner Base.'],['Ziehe eine Pflanze groß','Hacke → Samen → Gießen. Pflanzen wachsen beim Tageswechsel.'],['Finde 5 Kupfererz','Suche den Höhleneingang nordöstlich deiner Startposition.'],['Erkunde und baue eure Base aus','Die Alpha ist jetzt frei spielbar.']];ui.quest.innerHTML=`<b>${qs[state.quest][0]}</b><br><span class="muted">${qs[state.quest][1]}</span>`;ui.hotbar.innerHTML='';p.hotbar.forEach((id,i)=>{let d=document.createElement('div');d.className='slot'+(i===p.selected?' sel':'');d.appendChild(iconCanvas(items[id].icon));if(items[id].type==='stack'){let s=document.createElement('small');s.textContent=p.inv[id]||0;d.appendChild(s)}d.onclick=()=>{p.selected=i;renderUI()};ui.hotbar.appendChild(d)});let c=currentContext();ui.useBtn.textContent=c?c.label:'INTERAGIEREN';ui.targetHint.textContent=c?c.hint:'Erkunde die Umgebung';}
function openModal(tab='inventory'){ui.modalWrap.style.display='flex';renderModal(tab)}function closeModal(){ui.modalWrap.style.display='none'}
function renderModal(tab){let tabs=[['inventory','Inventar'],['craft','Bauen'],['help','Hilfe']];ui.tabs.innerHTML='';tabs.forEach(([id,n])=>{let d=document.createElement('div');d.className='tab'+(id===tab?' active':'');d.textContent=n;d.onclick=()=>renderModal(id);ui.tabs.appendChild(d)});if(tab==='inventory'){ui.modalTitle.textContent='Inventar';ui.modalDesc.textContent='Alles, was du gesammelt hast.';let h='<div class="grid">';for(const id of ['wood','stone','fiber','ore','berry','gel','seed'])h+=`<div class="card"><h3>${items[id].name}</h3><p>${state.player.inv[id]||0} Stück</p></div>`;h+='</div>';ui.body.innerHTML=h}else if(tab==='craft'){ui.modalTitle.textContent='Bauen & Crafting';ui.modalDesc.textContent='Baue eure Base aus. Das Objekt wird vor dir platziert.';let h='<div class="grid">';recipes.forEach((r,idx)=>{let cost=Object.entries(r.cost).map(([k,v])=>`${v} ${items[k].name}`).join(' · '),ok=Object.entries(r.cost).every(([k,v])=>(state.player.inv[k]||0)>=v);h+=`<div class="card"><h3>${r.name}</h3><p>${r.desc}<br>${cost}</p><button data-r="${idx}" ${ok?'':'disabled'}>Herstellen</button></div>`});h+='</div>';ui.body.innerHTML=h;ui.body.querySelectorAll('button[data-r]').forEach(b=>b.onclick=()=>craft(recipes[+b.dataset.r]))}else{ui.modalTitle.textContent='Steuerung';ui.modalDesc.textContent='Links bewegen. Der große goldene Button erkennt automatisch, was direkt vor dir sinnvoll ist. WERKZEUG nutzt weiterhin das aktuell gewählte Werkzeug manuell.';ui.body.innerHTML='<div class="card"><h3>Tipps</h3><p>Werkbank, Böden und Wände ergeben eure erste Base. In der Höhle findest du Kupfer, aber auch mehr Schleime. Beeren heilen derzeit über das Inventar noch nicht automatisch – sie sind bereits als Ressource für spätere Kochrezepte vorgesehen.</p></div>'}}
function craft(r){if(!spend(r.cost)){toast('Nicht genug Ressourcen');return}if(r.kind==='item'){for(const k in r.gives)addItem(k,r.gives[k]);toast(r.name+' hergestellt')}else{let p=state.player,d=60,x=Math.round((p.x+Math.cos(p.facing)*d)/TILE)*TILE,y=Math.round((p.y+Math.sin(p.facing)*d)/TILE)*TILE;state.buildings.push({type:r.id,x,y});toast(r.name+' platziert');if(r.id==='workbench')state.quest=Math.max(state.quest,2)}renderModal('craft');renderUI()}
document.getElementById('useBtn').addEventListener('pointerdown',e=>{e.preventDefault();smartUse()});document.getElementById('interactBtn').addEventListener('pointerdown',e=>{e.preventDefault();useTool()});document.getElementById('craftBtn').onclick=()=>openModal('craft');document.getElementById('invBtn').onclick=()=>openModal('inventory');document.getElementById('menuBtn').onclick=()=>openModal('help');document.getElementById('closeModal').onclick=closeModal;ui.modalWrap.addEventListener('pointerdown',e=>{if(e.target===ui.modalWrap)closeModal()});
document.getElementById('newBtn').onclick=()=>{state=newState();save();ui.title.style.display='none';renderUI()};document.getElementById('continueBtn').onclick=()=>{if(!load())state=newState();ui.title.style.display='none';renderUI()};if(!localStorage.getItem('meadowMatesAlpha4'))document.getElementById('continueBtn').style.display='none';
let last=performance.now();function loop(now){let dt=Math.min(.033,(now-last)/1000);last=now;if(ui.title.style.display==='none'&&ui.modalWrap.style.display!=='flex')update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
})();
