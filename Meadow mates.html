<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#1d3b2a"><title>Meadow Mates</title><style>
*{box-sizing:border-box;touch-action:none}body{margin:0;background:#17251c;color:#fff;font-family:system-ui,-apple-system,sans-serif;overflow:hidden}canvas{display:block;width:100vw;height:100vh;image-rendering:pixelated}.hud{position:fixed;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;pointer-events:none}.panel{background:#0009;border:2px solid #fff4;border-radius:12px;padding:8px 12px;font-weight:700}.help{position:fixed;top:58px;left:10px;background:#0008;padding:7px 10px;border-radius:10px;font-size:12px;pointer-events:none}.joy{position:fixed;left:22px;bottom:24px;width:128px;height:128px;border-radius:50%;background:#ffffff20;border:2px solid #ffffff40}.knob{position:absolute;left:39px;top:39px;width:50px;height:50px;border-radius:50%;background:#ffffff88}.actions{position:fixed;right:20px;bottom:26px;display:grid;grid-template-columns:76px 76px;gap:12px}.actions button{height:64px;border:0;border-radius:18px;background:#f5d06f;color:#34250d;font-weight:900;font-size:14px;box-shadow:0 4px 0 #9a7732}.actions button:active{transform:translateY(3px);box-shadow:0 1px 0 #9a7732}.title{position:fixed;left:50%;top:10px;transform:translateX(-50%);font-weight:900;text-shadow:0 2px 4px #000}.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#000c;padding:8px 14px;border-radius:12px;opacity:0;transition:.2s;pointer-events:none}
</style></head><body><canvas id="c"></canvas><div class="title">MEADOW MATES · v0.2</div><div class="hud"><div class="panel" id="inv">🪵 0 &nbsp; 🪨 0 &nbsp; 🌱 3</div><div class="panel" id="day">Tag 1 · 08:00</div></div><div class="help">Gemeinsame Welt: sammeln → bauen → pflanzen → ausbauen. BAUEN: 5 Holz + 3 Stein.</div><div class="joy" id="joy"><div class="knob" id="knob"></div></div><div class="actions"><button id="act">SAMMELN</button><button id="plant">PFLANZEN</button><button id="water">GIESSEN</button><button id="build">BAUEN</button><button id="save">SPEICHERN</button></div><div class="toast" id="toast"></div><script>
const c=document.querySelector('#c'),ctx=c.getContext('2d');let W,H,D=devicePixelRatio||1;function resize(){W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;ctx.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();
const TILE=48, world={w:30,h:22,objects:[],crops:[],buildings:[]};let p={x:11*TILE,y:8*TILE,wood:0,stone:0,seeds:3,dir:{x:0,y:1}}, time=8,day=1,last=performance.now();
function seeded(){world.objects=[];for(let y=1;y<world.h-1;y++)for(let x=1;x<world.w-1;x++){let n=(x*17+y*31+x*y*7)%23;if(n===2||n===7)world.objects.push({x:x*TILE+24,y:y*TILE+24,type:n===2?'tree':'rock'});}world.objects=world.objects.filter(o=>Math.hypot(o.x-p.x,o.y-p.y)>140)}seeded();
function save(){localStorage.setItem('meadowMatesV02',JSON.stringify({schema:2,p,world,time,day}));toast('Welt gespeichert ✓')}function load(){let s=localStorage.getItem('meadowMatesV02');if(s){let a=JSON.parse(s);p=a.p;Object.assign(world,a.world);time=a.time;day=a.day}}load();
let move={x:0,y:0};const joy=document.querySelector('#joy'),knob=document.querySelector('#knob');let jid=null;function joyMove(e){let r=joy.getBoundingClientRect(),t=[...e.touches].find(t=>t.identifier===jid);if(!t)return;let x=t.clientX-(r.left+r.width/2),y=t.clientY-(r.top+r.height/2),m=Math.hypot(x,y)||1,max=38;if(m>max){x=x/m*max;y=y/m*max}knob.style.transform=`translate(${x}px,${y}px)`;move={x:x/max,y:y/max};if(Math.hypot(x,y)>10)p.dir={x:move.x,y:move.y}}
joy.addEventListener('touchstart',e=>{jid=e.changedTouches[0].identifier;joyMove(e)},{passive:false});joy.addEventListener('touchmove',e=>{e.preventDefault();joyMove(e)},{passive:false});function end(e){if([...e.changedTouches].some(t=>t.identifier===jid)){jid=null;move={x:0,y:0};knob.style.transform=''}}joy.addEventListener('touchend',end);joy.addEventListener('touchcancel',end);
addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')move.x=-1;if(e.key==='ArrowRight'||e.key==='d')move.x=1;if(e.key==='ArrowUp'||e.key==='w')move.y=-1;if(e.key==='ArrowDown'||e.key==='s')move.y=1});addEventListener('keyup',()=>move={x:0,y:0});
function target(){return{x:p.x+p.dir.x*52,y:p.y+p.dir.y*52}}function toast(s){let e=document.querySelector('#toast');e.textContent=s;e.style.opacity=1;clearTimeout(e.t);e.t=setTimeout(()=>e.style.opacity=0,1100)}
document.querySelector('#act').onclick=()=>{let t=target(),best=null,bd=55;world.objects.forEach(o=>{let d=Math.hypot(o.x-t.x,o.y-t.y);if(d<bd){bd=d;best=o}});if(!best)return toast('Hier gibt es nichts zu sammeln');world.objects.splice(world.objects.indexOf(best),1);best.type==='tree'?p.wood++:p.stone++;toast(best.type==='tree'?'+1 Holz':'+1 Stein')};
document.querySelector('#plant').onclick=()=>{if(p.seeds<1)return toast('Keine Samen mehr');let t=target(),x=Math.round(t.x/TILE)*TILE,y=Math.round(t.y/TILE)*TILE;if(world.crops.some(q=>Math.hypot(q.x-x,q.y-y)<20))return toast('Hier wächst schon etwas');world.crops.push({x,y,age:0,water:false});p.seeds--;toast('Samen gepflanzt 🌱')};
document.querySelector('#water').onclick=()=>{let t=target(),q=world.crops.find(q=>Math.hypot(q.x-t.x,q.y-t.y)<55);if(!q)return toast('Keine Pflanze in Reichweite');q.water=true;toast('Gegossen 💧')};document.querySelector('#build').onclick=()=>{if(p.wood<5||p.stone<3)return toast('Werkbank: 5 Holz + 3 Stein');let t=target(),x=Math.round(t.x/TILE)*TILE,y=Math.round(t.y/TILE)*TILE;if(world.buildings.some(b=>Math.hypot(b.x-x,b.y-y)<35))return toast('Hier steht schon etwas');p.wood-=5;p.stone-=3;world.buildings.push({x,y,type:'bench'});toast('Werkbank gebaut 🔨');save()};document.querySelector('#save').onclick=save;
function draw(){ctx.clearRect(0,0,W,H);let camX=p.x-W/2,camY=p.y-H/2;ctx.fillStyle='#78b85a';ctx.fillRect(0,0,W,H);for(let y=0;y<world.h;y++)for(let x=0;x<world.w;x++){let sx=x*TILE-camX,sy=y*TILE-camY;ctx.fillStyle=((x+y)%2)?'#75b457':'#7abb5b';ctx.fillRect(sx,sy,TILE,TILE);ctx.fillStyle='#ffffff0b';ctx.fillRect(sx,sy,TILE-1,TILE-1)}world.buildings.forEach(b=>{let x=b.x-camX,y=b.y-camY;ctx.fillStyle='#805b38';ctx.fillRect(x-22,y-15,44,30);ctx.font='26px serif';ctx.textAlign='center';ctx.fillText('🛠️',x,y+8)});world.crops.forEach(q=>{let x=q.x-camX,y=q.y-camY;ctx.fillStyle='#72502d';ctx.fillRect(x-18,y-13,36,26);ctx.font='26px serif';ctx.textAlign='center';ctx.fillText(q.age>2?'🌻':'🌱',x,y+8);if(q.water){ctx.font='12px serif';ctx.fillText('💧',x+15,y-10)}});world.objects.forEach(o=>{let x=o.x-camX,y=o.y-camY;ctx.font=o.type==='tree'?'42px serif':'32px serif';ctx.textAlign='center';ctx.fillText(o.type==='tree'?'🌳':'🪨',x,y+14)});ctx.font='38px serif';ctx.fillText('🧑‍🌾',W/2,H/2+12);let t=target();ctx.strokeStyle='#fff8';ctx.lineWidth=2;ctx.strokeRect(t.x-camX-18,t.y-camY-18,36,36);document.querySelector('#inv').innerHTML=`🪵 ${p.wood} &nbsp; 🪨 ${p.stone} &nbsp; 🌱 ${p.seeds}`;document.querySelector('#day').textContent=`Tag ${day} · ${String(Math.floor(time)).padStart(2,'0')}:${String(Math.floor((time%1)*60)).padStart(2,'0')}`}
function loop(now){let dt=Math.min(.04,(now-last)/1000);last=now;let m=Math.hypot(move.x,move.y)||1;p.x+=move.x/m*150*dt;p.y+=move.y/m*150*dt;p.x=Math.max(TILE,Math.min((world.w-1)*TILE,p.x));p.y=Math.max(TILE,Math.min((world.h-1)*TILE,p.y));time+=dt*.18;if(time>=24){time=6;day++;world.crops.forEach(q=>{if(q.water)q.age++;q.water=false});p.seeds+=1;toast('Ein neuer Tag beginnt ☀️')}draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
